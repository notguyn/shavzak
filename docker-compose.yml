services:
  db:
    image: postgres:16-alpine
    container_name: shavzak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shavzak
      POSTGRES_PASSWORD: shavzak
      POSTGRES_DB: shavzak
    ports:
      - "5432:5432"
    volumes:
      - shavzak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shavzak"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: shavzak-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  shavzak-db-data:
